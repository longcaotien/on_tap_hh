# Build the Next.js app as a static site and publish it to GitHub Pages.
#
# GitHub Pages only serves static files, so this workflow:
#   1. installs dependencies,
#   2. runs `npm run build:static` (Next.js static export into `out/`),
#   3. uploads `out/` as the Pages artifact.
#
# Progress/notes are stored in the browser (localStorage) on Pages because a
# static host cannot run the PostgreSQL API. For the full server build deploy
# the repo to a Node host (e.g. Vercel) with DATABASE_URL configured.
name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect base path
        id: basepath
        run: |
          # Project sites live at https://<user>.github.io/<repo>/ ...
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static export
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.value }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
